<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Membership verification · KSMA</title><style>:root{--navy:#102746;--gold:#c8a445;--green:#26734d}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f2f5f4;color:#1e2b34;font:16px/1.5 system-ui,Segoe UI,sans-serif;display:grid;place-items:center;padding:20px}.card{width:min(100%,620px);background:#fff;border:1px solid #d7dfdc;border-top:7px solid var(--gold);border-radius:12px;padding:28px;box-shadow:0 12px 32px #10274612}.brand{display:flex;align-items:center;gap:15px}.brand img{width:74px;height:62px;object-fit:contain}.brand img+img{width:52px}.eyebrow{color:var(--green);font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}h1{margin:.2em 0;color:var(--navy);font-size:1.5rem}.status{padding:14px;border-radius:8px;background:#edf4ef;color:var(--green);font-weight:700}.bad{background:#fff2ee;color:#9a2c2c}.row{padding:9px 0;border-bottom:1px solid #e2e7e5}.label{color:#66747b;font-size:.86rem}.error{color:#9a2c2c}</style><main class="card"><div class="brand"><img src="/assets/ksma-seal.png" alt="KSMA seal"><img src="/assets/aakri-kada-logo.png" alt="Aakri Kada"></div><div class="eyebrow">Kerala Scrap Merchants Association</div><h1>Membership status verification</h1><div id="result" class="status">Checking member record…</div><section id="details" hidden></section><p class="label">This page checks the current KSMA member record.</p></main><script>const box=document.querySelector('#result'),details=document.querySelector('#details'),no=new URLSearchParams(location.search).get('no');if(!no){box.className='status bad';box.textContent='A membership number is required.'}else fetch('/api/verify?no='+encodeURIComponent(no)).then(r=>r.json()).then(d=>{if(!d.valid){box.className='status bad';box.textContent='No current active membership was found for this number.';return}box.textContent='Current active KSMA membership';details.hidden=false;details.innerHTML=[['Member',d.member.name],['Business',d.member.biz],['Membership no.',d.member.no],['Area',d.member.area+', '+d.member.dist],['Issued',d.member.issue||'Not recorded'],['Valid until',d.member.valid||'Not recorded']].map(([k,v])=>'<div class="row"><div class="label">'+k+'</div><b>'+String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))+'</b></div>').join('')}).catch(()=>{box.className='status bad';box.textContent='Membership verification is unavailable.'});</script></html>
