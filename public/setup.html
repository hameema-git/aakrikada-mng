<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>First administrator setup · KSMA</title><style>:root{--navy:#102746;--gold:#c8a445;--green:#26734d}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f2f5f4;color:#1e2b34;font:16px/1.5 system-ui,Segoe UI,sans-serif;display:grid;place-items:center;padding:20px}.card{width:min(100%,520px);background:#fff;border:1px solid #d7dfdc;border-top:7px solid var(--gold);border-radius:12px;padding:28px;box-shadow:0 12px 32px #10274612}.brand{display:flex;align-items:center;gap:15px;margin-bottom:22px}.brand img{width:74px;height:62px;object-fit:contain}.brand img+img{width:52px}.eyebrow{color:var(--green);font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}h1{margin:.15em 0;color:var(--navy);font-size:1.55rem}p{color:#52616a}label{display:block;font-weight:650;margin:14px 0 5px}input{width:100%;padding:11px;border:1px solid #aab7b3;border-radius:7px;font:inherit}button{margin-top:20px;padding:12px 18px;border:0;border-radius:7px;background:var(--navy);color:white;font:inherit;font-weight:700;cursor:pointer}.note{font-size:.9rem;background:#edf4ef;padding:12px;border-left:4px solid var(--green)}#msg{color:#9a2c2c;font-weight:650}</style><main class="card"><div class="brand"><img src="/assets/ksma-seal.png" alt=""><img src="/assets/aakri-kada-logo.png" alt=""></div><div class="eyebrow">Kerala Scrap Merchants Association</div><h1>Set up the first administrator</h1><p class="note">This one-time step secures the member and approval records on this server. The setup code is shown only in the server window.</p><form id="setup"><label for="code">One-time setup code</label><input id="code" required autocomplete="off"><label for="name">Administrator name</label><input id="name" required autocomplete="name"><label for="mobile">Mobile number</label><input id="mobile" required inputmode="numeric" pattern="[0-9]{10}" maxlength="10" autocomplete="tel"><label for="password">Password (at least 10 characters)</label><input id="password" required type="password" minlength="10" autocomplete="new-password"><button>Create administrator</button><p id="msg" role="status"></p></form></main><script>document.querySelector('#setup').addEventListener('submit',async e=>{e.preventDefault();const msg=document.querySelector('#msg');msg.textContent='';const body={code:document.querySelector('#code').value,name:document.querySelector('#name').value,mobile:document.querySelector('#mobile').value,password:document.querySelector('#password').value};try{const r=await fetch('/api/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw Error(d.error||'Setup failed');msg.style.color='#26734d';msg.textContent='Administrator created. You can now sign in.';setTimeout(()=>location.href='/',1200)}catch(x){msg.style.color='#9a2c2c';msg.textContent=x.message}});</script></html>
