<style>
:root{--p:#243a74;--ph:#1b2c5a;--ps:#e9edf7;--a:#2c8239;--as:#e4f1e6;--y:#eccb5a;--ink:#1b1f33;--mu:#454b6b;--ln:#d3d8ea;--bg:#f4f5f8;--dk:#17254f;--warn:#8f5200;--r:16px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 Inter,'Noto Sans Malayalam','Noto Sans Tamil',system-ui,sans-serif;overflow-x:hidden}
html[lang=ml] body,html[lang=ta] body{line-height:1.8}
h1,h2,h3,p,li,a,span,label,td{overflow-wrap:anywhere}
h1,h2,h3{margin:0;line-height:1.3}p{margin:0}ul,ol{list-style:none;margin:0;padding:0}
a{color:var(--p)}:focus-visible{outline:3px solid #2e4d78;outline-offset:2px}
svg{display:block;max-width:100%;height:auto}
.c{max-width:1160px;margin:auto;padding:0 16px}
.btn{white-space:normal;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 22px;border-radius:10px;border:2px solid var(--p);background:var(--p);color:#fff;font-weight:600;font-size:1rem;font-family:inherit;text-decoration:none;cursor:pointer;text-align:center}
.btn:hover{background:var(--ph)}
.btn.s{background:#fff;color:var(--p)}.btn.s:hover{background:var(--ps)}
.btn.l{background:var(--y);border-color:var(--y);color:#2a1f00}.btn.l:hover{background:#ffc94d}

.btn.sm{min-height:40px;padding:0 16px;font-size:.95rem}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--ln)}
.bar{display:flex;align-items:center;gap:12px;min-height:68px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.25rem;color:var(--p);text-decoration:none;white-space:nowrap;overflow-wrap:normal}
.mark{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;background:var(--p);color:#fff;font-size:1.2rem}
.nav{display:none;gap:2px;margin-left:8px}.topbar{display:none}
.nav a{padding:10px 9px;border-radius:10px;color:var(--ink);font-weight:600;font-size:.9rem;text-decoration:none;white-space:nowrap;overflow-wrap:normal}
.nav a:hover{background:var(--bg);color:var(--p)}.nav a.on{background:var(--ps);color:var(--p)}
.act{display:flex;align-items:center;gap:10px;margin-left:auto}
select,input,textarea{min-height:46px;padding:10px 12px;border:1.5px solid var(--ln);border-radius:10px;background:#fff;font:inherit;width:100%}
textarea{min-height:110px}
.act select{min-height:40px;padding:0 8px;width:auto;max-width:120px;font-weight:600}
.burger{width:46px;height:46px;border:1.5px solid var(--ln);background:#fff;border-radius:10px;font-size:1.4rem;color:var(--p);cursor:pointer}
.login{display:none;white-space:nowrap}
#menu{display:none;flex-direction:column;border-top:1px solid var(--ln);background:#fff;padding:8px 16px 20px;max-height:calc(100vh - 70px);overflow:auto}
#menu.open{display:flex}
#menu a.n{padding:14px 4px;border-bottom:1px solid var(--ln);font-weight:600;text-decoration:none;color:var(--ink)}
#menu .btn{margin-top:12px}
@media(min-width:1180px){.nav{display:flex;margin-left:auto}.burger,#menu{display:none!important}.act{display:none}.topbar{display:block}
html[lang=ml] .nav,html[lang=ta] .nav{display:none}html[lang=ml] .act,html[lang=ta] .act{display:flex}html[lang=ml] .burger,html[lang=ta] .burger{display:grid!important}html[lang=ml] #menu.open,html[lang=ta] #menu.open{display:flex!important}html[lang=ml] .act select,html[lang=ta] .act select{display:none}}
.topbar{background:var(--ps);border-bottom:1px solid var(--ln)}.topbar .c{display:flex;justify-content:flex-end;align-items:center;gap:12px;min-height:50px}.topbar select{width:auto;min-height:38px;padding:0 8px;font-weight:600}
.hero{background:var(--p);color:#fff;padding:40px 0}
.hg{display:grid;gap:32px;align-items:center}
.kick{display:inline-block;font-weight:700;letter-spacing:.12em;font-size:.85rem;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.14);margin-bottom:16px}
.hero h1{font-size:clamp(1.8rem,1.1rem + 3.6vw,3.2rem);max-width:18ch}
.lead{margin-top:16px;max-width:54ch;color:#dfe3fa;font-size:1.1rem}
.hb{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
.hart{border-radius:24px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.25)}

@media(min-width:760px){.card.sform{grid-template-columns:2fr 1.4fr auto}}
@media(min-width:960px){.hero{padding:64px 0 80px}.hg{grid-template-columns:1.05fr .95fr;gap:48px}}
.card{background:#fff;border:1px solid var(--ln);border-radius:var(--r);padding:24px;box-shadow:0 1px 2px rgba(22,26,51,.06),0 6px 20px rgba(22,26,51,.06);display:flex;flex-direction:column;gap:12px;color:var(--ink);min-width:0}
.card p{color:var(--mu)}.card h3{font-size:1.15rem}
.card.img{padding:0;overflow:hidden}.card.img .b{padding:20px 24px 24px;display:flex;flex-direction:column;gap:10px;flex:1}
.fl{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.95rem}
section.sec{padding:48px 0}.alt{background:#fff;border-block:1px solid var(--ln)}

.grid{display:grid;gap:16px}

.empty{border:2px dashed var(--ln);border-radius:var(--r);padding:32px 16px;text-align:center;color:var(--mu);background:#fff}

.cg{display:grid;gap:24px}@media(min-width:860px){.cg{grid-template-columns:1fr 1fr}}
.cl li{margin-bottom:20px}.cl a{color:var(--p)}.cl strong{display:block}
.dark .cl a{color:#fff}
.ban{background:var(--p);color:#fff;padding:32px 0;position:relative;overflow:hidden}
.ban .c{display:grid;gap:16px;align-items:center}
.ban h1{font-size:clamp(1.7rem,1.2rem + 2.4vw,2.6rem)}
.crumb{font-size:.9rem;color:#cfd4f5;margin-bottom:8px}.crumb a{color:#fff}
.ban .bi{display:none}
@media(min-width:800px){.ban .c{grid-template-columns:1fr 300px}.ban .bi{display:block;border-radius:16px;overflow:hidden}}
.split{display:grid;gap:24px;align-items:center}
@media(min-width:860px){.split{grid-template-columns:1fr 1fr;gap:48px}}
.prose p+p{margin-top:12px}.prose p{color:var(--mu)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.chip{border:1.5px solid var(--ln);background:#fff;border-radius:999px;min-height:40px;padding:0 16px;font-weight:600;font-size:.95rem;font-family:inherit;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--p);border-color:var(--p);color:#fff}
.msg{margin-top:12px;padding:12px 16px;border-radius:10px;background:#fff3d6;color:var(--warn);font-weight:600}
.frm{display:grid;gap:14px;max-width:520px}
.mapph{min-height:220px;border:2px dashed var(--ln);border-radius:var(--r);display:grid;place-items:center;text-align:center;padding:16px;color:var(--mu);background:var(--bg)}
.avatar{width:88px;height:88px;border-radius:50%;background:var(--ps);display:grid;place-items:center;font-size:2.2rem}
.stp{counter-reset:s}.stp li{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--ln)}
.stp li::before{counter-increment:s;content:counter(s);flex:none;width:34px;height:34px;border-radius:50%;background:var(--p);color:#fff;display:grid;place-items:center;font-weight:700}
.tabs{display:flex;gap:8px;margin-bottom:16px}
footer{background:var(--dk);color:#dfe3fa}
.fg{display:grid;gap:28px;padding:40px 16px}@media(min-width:860px){.fg{grid-template-columns:1.2fr 1fr 1.4fr}}
footer a{color:#fff;text-decoration:none}footer a:hover{text-decoration:underline}
footer h2{font-size:1.05rem;color:#fff;margin-bottom:10px}footer li{margin-bottom:6px}
.fb{border-top:1px solid rgba(255,255,255,.15);padding:14px 0;font-size:.9rem}
.wa{position:fixed;right:16px;bottom:16px;width:56px;height:56px;border-radius:50%;background:#1fa855;color:#fff;display:grid;place-items:center;text-decoration:none;font-size:1.5rem;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:15}
.note{background:#fff3d6;color:var(--warn);font-size:.85rem;text-align:center;padding:6px 12px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

.cb{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--as);color:var(--a);font-weight:600;font-size:.85rem}
.card.imp{border-left:5px solid #b3261e}
.card.aud{padding:28px}.audi{font-size:2rem;line-height:1}.audk{color:var(--a);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:.8rem}
@media(min-width:760px){.card.sform.sfull{grid-template-columns:repeat(2,minmax(0,1fr))}.card.sform.sfull .btn{grid-column:1/-1}}
</style>

<style>
/* ---- Membership portal (scoped copy of the uploaded prototype CSS) ---- */
#portal{color-scheme:light;--bg:#f4f5f8;--sf:#fff;--tx:#1b1f33;--mu:#4a5070;--pr:#243a74;--pr2:#2e4d78;--vi:#164194;--ln:#d6dae6;--ok:#2c8239;--wn:#a15c00;--er:#b3261e;box-sizing:border-box;}
#portal *{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
#portal{margin:0;background:var(--bg);color:var(--tx);font:17px/1.55 Inter,"Noto Sans Malayalam","Noto Sans Tamil",system-ui,sans-serif}
#portal .w{max-width:1040px;margin:0 auto;padding:0 18px}
#portal header{background:var(--sf);border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:5}
#portal .bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 0}
#portal .logo{font-weight:700;font-size:20px;color:var(--pr);text-decoration:none;margin-right:auto}
#portal nav{display:flex;gap:2px;flex-wrap:wrap}
#portal nav a{padding:8px 11px;border-radius:10px;color:var(--tx);text-decoration:none;font-weight:600;font-size:15px}
#portal nav a.on,#portal nav a:hover{background:var(--bg);color:var(--pr)}
#portal select,#portal input,#portal textarea{font:inherit;padding:11px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--sf);color:var(--tx);width:100%}
#portal header select{width:auto;padding:7px}
#portal .btn{display:inline-block;min-height:46px;padding:11px 20px;border-radius:12px;border:2px solid var(--pr);background:var(--pr);color:#fff;font:600 16px inherit;text-decoration:none;cursor:pointer;margin:4px 4px 4px 0}
#portal .btn.ghost{background:transparent;color:var(--pr)}
#portal .btn.sm{min-height:36px;padding:6px 14px;font-size:14px}

#portal :focus-visible{outline:3px solid var(--pr2);outline-offset:2px}

c_pp:['Pay the membership fee to receive your card.','കാർഡ് ലഭിക്കാൻ അംഗത്വ ഫീസ് അടയ്ക്കുക.','அட்டை பெற உறுப்பினர் கட்டணத்தைச் செலுத்தவும்.'],c_exp:['Membership fee is due. Pay to get your card back.','അംഗത്വ ഫീസ് കുടിശ്ശികയാണ്. കാർഡ് തിരികെ ലഭിക്കാൻ അടയ്ക്കുക.','கட்டணம் நிலுவை. அட்டையைத் திரும்பப் பெற செலுத்தவும்.'],c_wait:['Your card will be available after approval and payment.','അംഗീകാരവും പേയ്മെന്റും കഴിഞ്ഞാൽ കാർഡ് ലഭ്യമാകും.','ஒப்புதல் மற்றும் கட்டணத்திற்குப் பிறகு அட்டை கிடைக்கும்.'],
n_loc:['Your application passed Local Committee approval.','നിങ്ങളുടെ അപേക്ഷ ലോക്കൽ കമ്മിറ്റി അംഗീകരിച്ചു.','உங்கள் விண்ணப்பம் உள்ளூர் குழுவால் ஒப்புதல் பெற்றது.'],n_dis:['District Committee approved your application.','ജില്ലാ കമ്മിറ്റി അപേക്ഷ അംഗീകരിച്ചു.','மாவட்டக் குழு உங்கள் விண்ணப்பத்தை ஒப்புக்கொண்டது.'],n_ppd:['Approved! Please pay the membership fee to receive your card.','അംഗീകരിച്ചു! കാർഡ് ലഭിക്കാൻ അംഗത്വ ഫീസ് അടയ്ക്കുക.','ஒப்புதல்! அட்டை பெற உறுப்பினர் கட்டணத்தைச் செலுத்தவும்.'],n_rej:['Your application was not approved. Contact your Local Committee.','നിങ്ങളുടെ അപേക്ഷ അംഗീകരിച്ചില്ല. ലോക്കൽ കമ്മിറ്റിയെ ബന്ധപ്പെടുക.','உங்கள் விண்ணப்பம் ஏற்கப்படவில்லை. உள்ளூர் குழுவைத் தொடர்பு கொள்ளவும்.'],n_card:['Payment verified. Your membership card is ready.','പേയ്മെന്റ് സ്ഥിരീകരിച്ചു. അംഗത്വ കാർഡ് തയ്യാറാണ്.','கட்டணம் சரிபார்க்கப்பட்டது. உங்கள் அட்டை தயார்.'],n_exp:['Your membership fee is Due. Pay it to get your card back.','അംഗത്വ ഫീസ് കുടിശ്ശികയാണ്. കാർഡ് തിരികെ ലഭിക്കാൻ അടയ്ക്കുക.','உறுப்பினர் கட்டணம் நிலுவையில் உள்ளது. அட்டையைத் திரும்பப் பெற செலுத்தவும்.'],

ksma:()=>banner(T('kT'),'ksma','office')+`<section class="sec"><div class="c split">${ART('people','hart')}<div class="prose">${T('kB').map(p=>`<p>${esc(p)}</p>`).join('')}<div style="margin-top:20px;display:flex;gap:8px;flex-wrap:wrap">${link('#/committee',N('committee'),'')}${link('#/p/register',T('join'))}</div></div></div></section>
<section class="sec alt"><div class="c">${sh(T('ob'))}<div class="card">${ph()}<p>${esc(T('obD'))}</p></div></div></section>`,

committee:()=>banner(T('coT'),'committee','people')+`<section class="sec"><div class="c"><p class="sub" style="margin:0 0 24px">${esc(T('coS'))}</p><h2 class="t" style="font-size:1.35rem;margin:0 0 16px">${esc(T('cmOff'))}</h2><div class="grid g5">${officerCards()}</div><h2 class="t" style="font-size:1.35rem;margin:36px 0 14px">${esc(T('cmAll'))}</h2>${acc(T('cmSteer'),OFFICERS.length+STEERING_MORE.length,`<div class="mlist">${OFFICERS.map(mRow).join('')}${STEERING_MORE.map(mRow).join('')}</div>`)}${acc(T('cmExec'),EXECUTIVE.length,`<div class="mlist">${EXECUTIVE.map(mRow).join('')}</div>`)}${acc(T('lv')[1],'',`<p class="sub">${esc(T('coSoon'))}</p>`)}${acc(T('lv')[2],'',`<p class="sub">${esc(T('coSoon'))}</p>`)}<p class="sub" style="margin-top:14px">${esc(T('cmNote'))}</p></div></section>`,

vendors:()=>{const l=vend();return banner(T('vT'),'vendors','hero')+`<section class="sec"><div class="c"><p class="sub" style="margin:0 0 16px">${esc(T('vS'))}</p>${searchForm(true)}<p class="msg" role="status">${esc(T('vDemo'))}</p><h2 class="t" style="font-size:1.2rem;margin:20px 0 12px">${l.length} ${esc(T('vRes'))}</h2>${l.length?`<div class="grid g3">${vCards(l)}</div>`:`<div class="empty"><h3>${esc(T('vNone'))}</h3></div>`}</div></section>`},

activities:()=>banner(T('acT'),'activities','hero')+`<section class="sec"><div class="c">${sh(T('pgM'),T('acS'))}<div class="grid g3">${progCards()}</div></div></section><section class="sec alt"><div class="c">${sh(T('evM'))}<div class="grid g3">${evCards()}</div></div></section>`,

notices:()=>banner(T('noT'),'notices','office')+`<section class="sec"><div class="c">${sh(T('noT'),T('noS'))}<div class="chips" role="group"><button class="chip${S.cat?'':' on'}" data-cat="">${esc(T('allC'))}</button>${[...new Set(pubNotices().map(n=>n.c))].map(c=>`<button class="chip${S.cat===c?' on':''}" data-cat="${c}">${esc(t('c_'+c))}</button>`).join('')}</div><div class="grid g3">${noCards()}</div></div></section>`,

contact:()=>banner(T('ctT'),'contact','office')+`<section class="sec"><div class="c cg"><div>${sh(T('ctT'),T('ctS'))}${contactList()}<a class="btn" href="https://wa.me/919656884000" rel="noopener">${esc(T('wa'))}</a></div>
<div><form class="card frm" id="cf" style="max-width:none"><label class="fl"><span>${esc(T('fName'))}</span><input required></label><label class="fl"><span>${esc(T('fPhone'))}</span><input type="tel" inputmode="tel" required></label><label class="fl"><span>${esc(T('fMsg'))}</span><textarea required></textarea></label><button class="btn" type="submit">${esc(T('send'))}</button><p class="msg" id="cm" role="status" hidden style="margin:0">${esc(T('sent'))}</p></form></div></div>
<div class="c" style="margin-top:24px"><div class="mapph"><div>${ph()}<p style="margin-top:8px">${esc(T('map'))}</p></div></div></div></section>`
};
const ROUTES={'':'home','about-aakrikada':'about','about-ksma':'ksma',committee:'committee',vendors:'vendors',activities:'activities',notices:'notices',contact:'contact',join:'join',login:'login'};
if(!SHOW_VENDORS)delete ROUTES.vendors;
const NAV_ALL=[['home','#/'],['ksma','#/about-ksma'],['committee','#/committee'],['vendors','#/vendors'],['activities','#/activities'],['notices','#/notices'],['about','#/about-aakrikada'],['contact','#/contact']];
const NAV=NAV_ALL.filter(([k])=>SHOW_VENDORS||k!=='vendors');

function chrome(cur){
 const hm=U?(U.role=='member'?'dash':cn[U.role][0]):null;
 document.documentElement.lang=LG;
 $('#brand').textContent=$('#brand2').textContent=T('brand');
 $('#bt1').textContent=({en:'KERALA SCRAP MERCHANTS ASSOCIATION',ml:'കേരള സ്ക്രാപ്പ് മർച്ചന്റ്സ് അസ്സോസിയേഷൻ',ta:'கேரள ஸ்க்ராப் வணிகர்கள் சங்கம்'})[LG];
 $('#bt2').textContent=({en:'STATE COMMITTEE · KSMA',ml:'സംസ്ഥാന കമ്മിറ്റി · KSMA',ta:'மாநிலக் குழு · KSMA'})[LG];
 document.querySelectorAll('[data-i]').forEach(i=>{if(i.getAttribute('src')!==IMG[i.dataset.i])i.src=IMG[i.dataset.i]});
 const lb=U?[t('dash'),'#/p/'+hm]:[T('login'),'#/p/login'];$('#loginBtn').textContent=$('#loginBtn2').textContent=lb[0];$('#loginBtn').href=$('#loginBtn2').href=lb[1];
 const jb=$('#joinBtn2');if(U){jb.textContent=t('logout');jb.href='#/';jb.onclick=()=>{__logout();return false}}else{jb.textContent=T('join');jb.href='#/p/register';jb.onclick=null}
 $('#lang').value=$('#lang2').value=LG;
 const a=NAV.map(([k,h])=>`<a href="${h}"${NAVKEY[cur]===k?' class="on" aria-current="page"':''}>${esc(N(k))}</a>`).join('');
 $('#nav').innerHTML=a;
 $('#menu').innerHTML=NAV.map(([k,h])=>`<a class="n" href="${h}">${esc(N(k))}</a>`).join('')+(U?`<a class="btn" href="#/p/${hm}">${esc(t('dash'))}</a><a class="btn s" href="#/" onclick="__logout();return false">${esc(t('logout'))}</a>`:`<a class="btn" href="#/p/register">${esc(T('join'))}</a><a class="btn s" href="#/p/login">${esc(T('login'))}</a>`);
 $('#foot').innerHTML=`<div><div class="footseal"><img src="${IMG.seal}" alt=""><img src="${IMG.aakri}" alt="Aakri Kada" style="height:46px;width:auto;background:#fff;padding:6px 10px;border-radius:6px"></div><p style="margin-top:12px">Kerala Scrap Merchants Association (KSMA)</p><p class="footreg">Reg. No. EKM/TC/614/2017</p><p class="slogan">ഭൂമിയെ സംരക്ഷിക്കാൻ കൈകോർക്കൂ.. പുനരുപയോഗത്തിലൂടെ...</p></div>
 <div><h2>${esc(SD.en.foot)}</h2><ul>${NAV.map(([k,h])=>`<li><a href="${h}">${esc(N(k))}</a></li>`).join('')}<li><a href="#/p/register">${esc(T('join'))}</a></li><li><a href="#/p/login">${esc(T('login'))}</a></li></ul></div>
 <div><h2>${esc(T('ctO'))}</h2><p>Door No. VP1/35F, Marampally<br>Aluva, Ernakulam – 683 105</p><p><a href="mailto:ksmastate@gmail.com">ksmastate@gmail.com</a></p></div>`;
}
const NAVKEY={home:'home',about:'about',ksma:'ksma',committee:'committee',vendors:'vendors',activities:'activities',notices:'notices',contact:'contact',join:null,login:null};

function bind(r){
 const sf=$('#sf');if(sf){sf.onsubmit=e=>{e.preventDefault();S.q=$('#sq').value.trim();S.d=$('#sd').value;S.a=$('#sa')?$('#sa').value:'';S.bt=$('#sb2')?$('#sb2').value:'';S.vmsg=true;if(r==='vendors')render();else location.hash='#/vendors'};const sd=$('#sd');if(sd&&$('#sa'))sd.onchange=()=>{S.q=$('#sq').value.trim();S.d=sd.value;S.a='';S.bt=$('#sb2').value;render()}}
 document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{S.cat=b.dataset.cat;render()});
 document.querySelectorAll('[data-lt]').forEach(b=>b.onclick=()=>{S.committee=b.dataset.lt==='1';render()});
 const cf=$('#cf');if(cf)cf.onsubmit=e=>{e.preventDefault();$('#cm').hidden=false};
 const lf=$('#lf');if(lf)lf.onsubmit=e=>{e.preventDefault();$('#lm').hidden=false};
 const fp=$('#fp');if(fp)fp.onclick=e=>{e.preventDefault();$('#lm').hidden=false};
}
window.__logout=()=>{U=null;if(location.hash===''||location.hash==='#/')render();else location.hash='#/'};
function renderPortal(r){
 $('#app').hidden=true;$('#portal').hidden=false;
 R=r;draw();
 if(location.hash.startsWith('#/p/')){chrome('portal')}
 $('#menu').classList.remove('open');$('#bg').textContent='\u2630';$('#bg').setAttribute('aria-expanded','false');
 document.title='Member portal \u2013 KSMA';
}
function render(){
 const key=location.hash.replace(/^#\/?/,'');
 if(key==='p'||key.indexOf('p/')===0){return renderPortal(key.slice(2)||'login')}
 if(key==='vendors'&&!SHOW_VENDORS){location.replace('#/');return}
 if(key==='join'){location.replace('#/p/register');return}
 if(key==='login'){location.replace('#/p/login');return}
 $('#portal').hidden=true;$('#app').hidden=false;
 const r=ROUTES[key]??'home';
 if(r!=='vendors'&&r!=='home')S.vmsg=false;
 $('#app').innerHTML=P[r]();
 chrome(r);bind(r);
 $('#menu').classList.remove('open');$('#bg').textContent='\u2630';$('#bg').setAttribute('aria-expanded','false');
 document.title=(r==='home'?'':(N(NAVKEY[r])||'')+' \u2013 ')+'KSMA \u2013 Kerala Scrap Merchants Association';
}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);const f=$('#portal').hidden?$('#app'):$('#papp');f&&f.focus({preventScroll:true})});
['#lang','#lang2'].forEach(i=>$(i).onchange=e=>{LG=e.target.value;L={en:0,ml:1,ta:2}[LG];render()});
$('#bg').onclick=()=>{const o=$('#menu').classList.toggle('open');$('#bg').setAttribute('aria-expanded',o);$('#bg').textContent=o?'✕':'☰'};
$('#yr').textContent=new Date().getFullYear();
render();

})();
</script>
<style>.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}</style>
<script>
/* PWA: service worker + install button. Needs https (Vercel / Cloudflare links are https) or localhost. */
(function(){
 if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(e=>console.warn('SW failed',e)))}
 const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
 let dp=null;const b=document.getElementById('inst');
 addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;if(!standalone)b.hidden=false});
 b.onclick=async()=>{if(!dp)return;dp.prompt();await dp.userChoice;dp=null;b.hidden=true};
 addEventListener('appinstalled',()=>{b.hidden=true});
 if(/iphone|ipad|ipod/i.test(navigator.userAgent)&&!standalone)document.getElementById('iosTip').hidden=false;
})();
</script>
<script>
(()=>{const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,app=document.getElementById('app');
const io=('IntersectionObserver' in window&&!reduce)?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.1}):null;
function reveal(){if(!io)return;document.querySelectorAll('#app .sec .card,#app .sec .sh,#app .qk,#app .lc,#app .mt,#app .gt,#app .band,#app .fact').forEach((el,i)=>{if(el.dataset.rv)return;el.dataset.rv=1;el.classList.add('rv');el.style.setProperty('--d',(i%6)*70+'ms');io.observe(el)})}
function slide(h,n){const s=[...h.querySelectorAll('.hsl')],d=[...h.querySelectorAll('.hd button')];let i=s.findIndex(x=>x.classList.contains('on'));i=(n+s.length)%s.length;s.forEach((x,k)=>x.classList.toggle('on',k===i));d.forEach((x,k)=>x.classList.toggle('on',k===i))}
function cur(h){return [...h.querySelectorAll('.hsl')].findIndex(x=>x.classList.contains('on'))}
if(!reduce)setInterval(()=>{const h=document.querySelector('.hs');if(h&&!document.hidden&&!h.matches(':hover')&&!h.contains(document.activeElement))slide(h,cur(h)+1)},6500);
function pm(){let d=document.getElementById('pm');if(!d){d=document.createElement('dialog');d.id='pm';d.addEventListener('click',e=>{if(e.target===d||e.target.closest('.pmx'))d.close()});document.body.appendChild(d)}return d}
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function person(b){const d=pm(),D=b.dataset,k=D.k;d.className='';d.replaceChildren();const h=el('div','pmh'),x=el('button','pmx','\u00d7');x.type='button';x.setAttribute('aria-label',D.close);h.appendChild(x);
const im=el('img','pmp');im.src=window.IMG[k];im.alt=D.n||'';const bd=el('div','pmb');bd.appendChild(el('h3','',D.n||D.tbd));bd.appendChild(el('p','pmr',D.r));
if(D.t){const a=el('a','btn l',D.call+' '+D.t);a.href='tel:+91'+D.t;bd.appendChild(a)}d.append(h,im,bd);d.showModal()}
function gal(b){const d=pm(),D=b.dataset;d.className='wide';d.replaceChildren();const x=el('button','pmx','\u00d7');x.type='button';x.setAttribute('aria-label',D.close);const im=el('img','pmw');im.src=window.IMG[D.g];im.alt=D.cap;const bd=el('div','pmb');bd.appendChild(el('b','',D.cap));d.append(x,im,bd);d.showModal()}
document.addEventListener('click',e=>{const t=e.target;let b;
if(b=t.closest('[data-cm]'))return person(b);
if(b=t.closest('[data-g]'))return gal(b);
if(b=t.closest('[data-tab]')){const i=+b.dataset.tab;document.querySelectorAll('.cmt [role=tab]').forEach((x,k)=>{x.setAttribute('aria-selected',k===i);const p=document.getElementById('cmp'+k);if(p)p.hidden=k!==i});return}
if(b=t.closest('[data-scroll]')){const s=document.getElementById(b.dataset.scroll);if(s)s.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});return}
if(b=t.closest('[data-hs]')){const h=b.closest('.hs');return slide(h,cur(h)+ +b.dataset.hs)}
if(b=t.closest('[data-hd]')){const h=b.closest('.hs');return slide(h,+b.dataset.hd)}});
document.addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('.cmt')&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){const t=[...document.querySelectorAll('.cmt [role=tab]')],i=t.indexOf(e.target.closest('[role=tab]'));if(i<0)return;const n=t[(i+(e.key==='ArrowRight'?1:-1)+t.length)%t.length];n.focus();n.click()}});
const hdr=document.querySelector('header');addEventListener('scroll',()=>hdr.classList.toggle('sm',scrollY>70),{passive:true});
new MutationObserver(reveal).observe(app,{childList:true});reveal();
})();
</script>
