<style>

.cb{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--as);color:var(--a);font-weight:600;font-size:.85rem}

c_pp:['Pay the membership fee to receive your card.','കാർഡ് ലഭിക്കാൻ അംഗത്വ ഫീസ് അടയ്ക്കുക.','அட்டை பெற உறுப்பினர் கட்டணத்தைச் செலுத்தவும்.'],c_exp:['Membership fee is due. Pay to get your card back.','അംഗത്വ ഫീസ് കുടിശ്ശികയാണ്. കാർഡ് തിരികെ ലഭിക്കാൻ അടയ്ക്കുക.','கட்டணம் நிலுவை. அட்டையைத் திரும்பப் பெற செலுத்தவும்.'],c_wait:['Your card will be available after approval and payment.','അംഗീകാരവും പേയ്മെന്റും കഴിഞ്ഞാൽ കാർഡ് ലഭ്യമാകും.','ஒப்புதல் மற்றும் கட்டணத்திற்குப் பிறகு அட்டை கிடைக்கும்.'],
n_loc:['Your application passed Local Committee approval.','നിങ്ങളുടെ അപേക്ഷ ലോക്കൽ കമ്മിറ്റി അംഗീകരിച്ചു.','உங்கள் விண்ணப்பம் உள்ளூர் குழுவால் ஒப்புதல் பெற்றது.'],n_dis:['District Committee approved your application.','ജില്ലാ കമ്മിറ്റി അപേക്ഷ അംഗീകരിച്ചു.','மாவட்டக் குழு உங்கள் விண்ணப்பத்தை ஒப்புக்கொண்டது.'],n_ppd:['Approved! Please pay the membership fee to receive your card.','അംഗീകരിച്ചു! കാർഡ് ലഭിക്കാൻ അംഗത്വ ഫീസ് അടയ്ക്കുക.','ஒப்புதல்! அட்டை பெற உறுப்பினர் கட்டணத்தைச் செலுத்தவும்.'],n_rej:['Your application was not approved. Contact your Local Committee.','നിങ്ങളുടെ അപേക്ഷ അംഗീകരിച്ചില്ല. ലോക്കൽ കമ്മിറ്റിയെ ബന്ധപ്പെടുക.','உங்கள் விண்ணப்பம் ஏற்கப்படவில்லை. உள்ளூர் குழுவைத் தொடர்பு கொள்ளவும்.'],n_card:['Payment verified. Your membership card is ready.','പേയ്മെന്റ് സ്ഥിരീകരിച്ചു. അംഗത്വ കാർഡ് തയ്യാറാണ്.','கட்டணம் சரிபார்க்கப்பட்டது. உங்கள் அட்டை தயார்.'],n_exp:['Your membership fee is Due. Pay it to get your card back.','അംഗത്വ ഫീസ് കുടിശ്ശികയാണ്. കാർഡ് തിരികെ ലഭിക്കാൻ അടയ്ക്കുക.','உறுப்பினர் கட்டணம் நிலுவையில் உள்ளது. அட்டையைத் திரும்பப் பெற செலுத்தவும்.'],

function mCopy(id){const m=D.msgs.find(x=>x.id==id),txt=(m.imp?'⚠ ':'')+m.ti+'\n\n'+m.body,done=()=>toast(t('m_copied')),fb=()=>{const a=document.createElement('textarea');a.value=txt;document.body.append(a);a.select();try{document.execCommand('copy')}catch(x){}a.remove();done()};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done,fb);else fb()}

 plant:`<svg viewBox="0 0 480 340" role="img" aria-label="Illustration of a recycling centre">${SKY}<rect x="70" y="150" width="230" height="140" fill="#fff"/><rect x="70" y="130" width="230" height="26" fill="#1e2a78"/><rect x="320" y="90" width="34" height="200" fill="#8a93b8"/><rect x="316" y="82" width="42" height="14" fill="#6b749c"/><rect x="95" y="180" width="60" height="110" fill="#e9f5ee"/><rect x="175" y="180" width="105" height="48" fill="#cfe3ff"/><text x="228" y="266" font-size="46" text-anchor="middle" fill="#17794a">♻</text><rect x="380" y="250" width="70" height="42" fill="#8a93b8"/><rect x="390" y="228" width="50" height="24" fill="#a9b1d1"/>${TREE(40,.9)}${ROAD}</svg>`,
 people:`<svg viewBox="0 0 480 340" role="img" aria-label="Illustration of a community">${SKY}${[[110,'#1e2a78'],[200,'#17794a'],[290,'#f2b632'],[380,'#c0392b']].map(([x,c],i)=>`<g transform="translate(${x} ${i%2?10:0})"><circle cx="0" cy="170" r="26" fill="#f1c9a5"/><path d="M-42 292a42 62 0 0 1 84 0z" fill="${c}"/></g>`).join('')}${ROAD}</svg>`,
 office:`<svg viewBox="0 0 480 340" role="img" aria-label="Illustration of an association office">${SKY}<rect x="130" y="120" width="220" height="172" fill="#fff"/><path d="M118 124L240 66l122 58z" fill="#1e2a78"/>${[0,1,2].map(i=>`<rect x="${158+i*64}" y="150" width="40" height="44" fill="#cfe3ff"/>`).join('')}<rect x="216" y="226" width="48" height="66" fill="#17794a"/>${TREE(70,.9)}${TREE(420,.9)}${ROAD}</svg>`
};
const ART=(k,cls='')=>`<div class="${cls}">${SC[k]}</div>`;

/* ---- Shared pieces ---- */
const ph=()=>`<span class="phtag">${esc(T('ph'))}</span>`;
const banner=(title,key,art)=>`<section class="ban"><div class="c"><div><p class="crumb"><a href="#/">${esc(N('home'))}</a> / ${esc(N(key))}</p><h1>${esc(title)}</h1></div>${ART(art,'bi')}</section>`.replace('</div></section>','</div></div></section>');
const sh=(t,s,act='')=>`<div class="sh"><div><h2 class="t">${esc(t)}</h2>${s?`<p class="sub">${esc(s)}</p>`:''}</div>${act}</div>`;
const link=(h,t,c='s')=>`<a class="btn ${c}" href="${h}">${esc(t)}</a>`;
const areasFor=d=>d&&AR[d]?AR[d]:[...new Set(Object.values(AR).flat())];
const searchForm=full=>`<form class="card sform${full?' sfull':''}" id="sf"><label class="fl"><span>${esc(T('vName'))}</span><input type="search" id="sq" value="${esc(S.q)}" autocomplete="off"></label><label class="fl"><span>${esc(T('vDist'))}</span><select id="sd"><option value="">${esc(T('vAll'))}</option>${DIST.map(d=>`<option${S.d===d?' selected':''}>${d}</option>`).join('')}</select></label>${full?`<label class="fl"><span>${esc(t('area'))}</span><select id="sa"><option value="">${esc(t('all'))}</option>${areasFor(S.d).map(a=>`<option${S.a===a?' selected':''}>${a}</option>`).join('')}</select></label><label class="fl"><span>${esc(t('btype'))}</span><select id="sb2"><option value="">${esc(t('all'))}</option>${['bt1','bt2','bt3','bt4','bt5'].map(k=>`<option value="${k}"${S.bt===k?' selected':''}>${esc(t(k))}</option>`).join('')}</select></label>`:''}<button class="btn" type="submit">${esc(T('vBtn'))}</button></form>`;
const cards=(arr,fn)=>arr.map(fn).join('');
const evCards=()=>cards(T('ev'),(t,i)=>`<article class="card img">${ART(['hero','plant','people'][i],'')}<div class="b">${ph()}<h3>${esc(t)}</h3><p>${esc(T('evD'))}</p></div></article>`);
const pubNotices=()=>D.notices.filter(n=>visFor(null,n));
const noCards=lim=>{const l=pubNotices().filter(n=>lim||!S.cat||n.c===S.cat).slice(0,lim||99);return l.length?l.map(n=>`<article class="card${n.imp?' imp':''}"><div style="display:flex;gap:6px;flex-wrap:wrap"><span class="cb">${esc(t('c_'+n.c))}</span><span class="phtag">${esc(t('demo'))}</span></div><h3>${esc(n.ti||t('nt'+n.k))}</h3><p>${esc(n.ti?n.su:t('ns'+n.k))}</p><p style="font-size:.9rem">\u{1F4C5} ${esc(n.d)}</p></article>`).join(''):`<div class="empty">${esc(t('none'))}</div>`};
const progCards=lim=>{const l=D.prog.filter(p=>progVis(null,p)).slice(0,lim||99);return l.length?l.map((p,i)=>`<article class="card img">${p.img?`<img src="${p.img}" alt="" style="width:100%;height:200px;object-fit:cover">`:ART(['hero','plant','people'][i%3])}<div class="b"><span class="phtag">${esc(t('demo'))}</span><h3>${esc(p.ti)}</h3></div></article>`).join(''):`<div class="empty">${esc(t('none'))}</div>`};
const vend=()=>D.m.filter(m=>m.role=='member'&&m.st=='active'&&!oldC(m)).filter(m=>(!S.d||m.dist==S.d)&&(!S.a||m.area==S.a)&&(!S.bt||m.btype==S.bt)&&(!S.q||(m.biz+' '+m.name+' '+m.area).toLowerCase().includes(S.q.toLowerCase())));
const vCards=l=>l.map(m=>`<article class="card"><span class="phtag">${esc(t('demo'))}</span><h3>${esc(m.biz)}</h3><p>\u{1F4CD} ${esc(m.area)}, ${esc(m.dist)}</p><p><span class="cb">\u2713 ${esc(T('ksmaM'))}</span> <span class="cb">${esc(t(m.btype||'bt5'))}</span></p><p style="font-size:.9rem">${esc(t('valid'))}: ${esc(m.valid)}</p><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:auto"><a class="btn sm" href="tel:+91${esc(m.mobile)}">${esc(T('call'))}</a><a class="btn s sm" href="https://wa.me/91${esc(m.mobile)}" rel="noopener">${esc(T('wa'))}</a></div></article>`).join('');
const peopleCards=(n=3)=>T('lv').slice(0,n).map(l=>`<article class="card" style="align-items:center;text-align:center">${ph()}<div class="avatar" aria-hidden="true">👤</div><h3>${esc(T('peN'))}</h3><p>${esc(T('peD'))} · ${esc(l)}</p></article>`).join('');
const quotes=()=>T('q').map(([n,t])=>`<figure class="card q"><p lang="${LG}">“${esc(t)}”</p><b>${esc(n)}</b></figure>`).join('');
const contactList=()=>`<ul class="cl"><li><strong>${esc(T('ctA'))}</strong>${T('addr').map(a=>`<span style="display:block">${esc(a)}</span>`).join('')}</li><li><strong>${esc(T('ctP'))}</strong><a href="tel:+919656884000">+91 9656 884 000</a></li><li><strong>${esc(T('ctE'))}</strong><a href="mailto:info@aakrikada.in">info@aakrikada.in</a></li></ul>`;

/* ---- Pages ---- */
const P={
home:()=>`
<section class="hero"><div class="c hg"><div><p class="kick">${esc(T('brand').toUpperCase())}</p><h1>${esc(T('title'))}</h1><p class="lead">${esc(SHOW_VENDORS?T('lead'):T('leadNV'))}</p>
<div class="hb">${SHOW_VENDORS?link('#/vendors',T('find'),'l'):''}${link('#/p/register',T('join'),SHOW_VENDORS?'g':'l')}${link('#/p/login',T('login'),'g')}</div></div>${ART('hero','hart')}</div></section>
${SHOW_VENDORS?`<div class="c sbox">${searchForm()}</div>`:''}
<section class="sec"><div class="c grid g2"${SHOW_VENDORS?'':' style="grid-template-columns:1fr"'}>
${SHOW_VENDORS?`<article class="card aud"><span class="audi" aria-hidden="true">\u{1F50D}</span><h2 class="t" style="font-size:1.3rem;margin:0"><small class="audk">${esc(T('audC'))}</small><br>${esc(T('audCT'))}</h2><p>${esc(T('audCD'))}</p><div style="margin-top:auto">${link('#/vendors',T('find'),'')}</div></article>`:''}
<article class="card aud"><span class="audi" aria-hidden="true">\u{1FAAA}</span><h2 class="t" style="font-size:1.3rem;margin:0"><small class="audk">${esc(T('audM'))}</small><br>${esc(T('audMT'))}</h2><p>${esc(T('audMD'))}</p><div style="margin-top:auto;display:flex;gap:8px;flex-wrap:wrap">${link('#/p/register',T('join'),'')}${link('#/p/login',T('login'))}</div></article>
</div></section>
<section class="sec alt"><div class="c">${sh(T('howT'))}<ol class="grid g3">${T('how').filter((h,i)=>SHOW_VENDORS||i<2).map((h,i)=>`<li class="card step"><span class="n" aria-hidden="true">${h[0]}<b>${i+1}</b></span><h3>${esc(h[1])}</h3><p>${esc(h[2])}</p></li>`).join('')}</ol></div></section>
<section class="sec"><div class="c grid g2">
<article class="card img">${ART('plant')}<div class="b"><h2 class="t" style="font-size:1.5rem">${esc(T('aT'))}</h2><p>${esc(T('aB')[0])}</p>${link('#/about-aakrikada',T('more'))}</div></article>
<article class="card img">${ART('office')}<div class="b"><h2 class="t" style="font-size:1.5rem">${esc(T('kT'))}</h2><p>${esc(T('kB')[0])}</p>${link('#/about-ksma',T('more'))}</div></article></div></section>
<section class="sec alt"><div class="c">${sh(T('acT'),T('acS'),link('#/activities',T('all')))}<div class="grid g3">${progCards(3)}</div></div></section>
<section class="sec"><div class="c">${sh(T('noT'),T('noS'),link('#/notices',T('all')))}<div class="grid g3">${noCards(3)}</div></div></section>
<section class="sec alt"><div class="c">${sh(T('coT'),T('coS'),link('#/committee',T('all')))}<div class="grid g3">${peopleCards()}</div></div></section>
<section class="sec"><div class="c">${sh(T('teT'))}<div class="grid g2">${quotes()}</div></div></section>
<section class="sec dark"><div class="c">${sh(T('ctT'),T('ctS'))}<div class="cg">${contactList()}<div class="card"><h3>${esc(T('spT'))}</h3><p>${esc(T('spD'))}</p><div style="display:flex;flex-wrap:wrap;gap:8px"><a class="btn" href="tel:+919656884000">${esc(T('call'))}</a><a class="btn s" href="https://wa.me/919656884000" rel="noopener">${esc(T('wa'))}</a></div></div></div></div></section>`,

about:()=>banner(T('aT'),'about','plant')+`<section class="sec"><div class="c split"><div class="prose">${T('aB').map(p=>`<p>${esc(p)}</p>`).join('')}<div style="margin-top:20px;display:flex;gap:8px;flex-wrap:wrap">${SHOW_VENDORS?link('#/vendors',T('find'),''):''}${link('#/about-ksma',N('ksma'))}</div></div>${ART('hero','hart')}</div></section>
<section class="sec alt"><div class="c">${sh(T('ob'))}<div class="card">${ph()}<p>${esc(T('obD'))}</p></div></div></section>`,

ksma:()=>banner(T('kT'),'ksma','office')+`<section class="sec"><div class="c split">${ART('people','hart')}<div class="prose">${T('kB').map(p=>`<p>${esc(p)}</p>`).join('')}<div style="margin-top:20px;display:flex;gap:8px;flex-wrap:wrap">${link('#/committee',N('committee'),'')}${link('#/p/register',T('join'))}</div></div></div></section>
<section class="sec alt"><div class="c">${sh(T('ob'))}<div class="card">${ph()}<p>${esc(T('obD'))}</p></div></div></section>`,

committee:()=>banner(T('coT'),'committee','people')+`<section class="sec"><div class="c"><p class="sub" style="margin:0 0 24px">${esc(T('coS'))}</p>${T('lv').map(l=>`<h2 class="t" style="font-size:1.35rem;margin:28px 0 16px">${esc(l)}</h2><div class="grid g3">${peopleCards(1)}${peopleCards(1)}${peopleCards(1)}</div>`).join('')}</div></section>`,

vendors:()=>{const l=vend();return banner(T('vT'),'vendors','hero')+`<section class="sec"><div class="c"><p class="sub" style="margin:0 0 16px">${esc(T('vS'))}</p>${searchForm(true)}<p class="msg" role="status">${esc(T('vDemo'))}</p><h2 class="t" style="font-size:1.2rem;margin:20px 0 12px">${l.length} ${esc(T('vRes'))}</h2>${l.length?`<div class="grid g3">${vCards(l)}</div>`:`<div class="empty"><h3>${esc(T('vNone'))}</h3></div>`}</div></section>`},

activities:()=>banner(T('acT'),'activities','hero')+`<section class="sec"><div class="c">${sh(T('pgM'),T('acS'))}<div class="grid g3">${progCards()}</div></div></section><section class="sec alt"><div class="c">${sh(T('evM'))}<div class="grid g3">${evCards()}</div></div></section>`,

notices:()=>banner(T('noT'),'notices','office')+`<section class="sec"><div class="c">${sh(T('noT'),T('noS'))}<div class="chips" role="group"><button class="chip${S.cat?'':' on'}" data-cat="">${esc(T('allC'))}</button>${[...new Set(pubNotices().map(n=>n.c))].map(c=>`<button class="chip${S.cat===c?' on':''}" data-cat="${c}">${esc(t('c_'+c))}</button>`).join('')}</div><div class="grid g3">${noCards()}</div></div></section>`,

contact:()=>banner(T('ctT'),'contact','office')+`<section class="sec"><div class="c cg"><div>${sh(T('ctT'),T('ctS'))}${contactList()}<a class="btn" href="https://wa.me/919656884000" rel="noopener">${esc(T('wa'))}</a></div>
<div><form class="card frm" id="cf" style="max-width:none"><label class="fl"><span>${esc(T('fName'))}</span><input required></label><label class="fl"><span>${esc(T('fPhone'))}</span><input type="tel" inputmode="tel" required></label><label class="fl"><span>${esc(T('fMsg'))}</span><textarea required></textarea></label><button class="btn" type="submit">${esc(T('send'))}</button><p class="msg" id="cm" role="status" hidden style="margin:0">${esc(T('sent'))}</p></form></div></div>
<div class="c" style="margin-top:24px"><div class="mapph"><div>${ph()}<p style="margin-top:8px">${esc(T('map'))}</p></div></div></div></section>`
};
const ROUTES={'':'home','about-aakrikada':'about','about-ksma':'ksma',committee:'committee',vendors:'vendors',activities:'activities',notices:'notices',contact:'contact',join:'join',login:'login'};
if(!SHOW_VENDORS)delete ROUTES.vendors;
const NAV_ALL=[['home','#/'],['about','#/about-aakrikada'],['ksma','#/about-ksma'],['committee','#/committee'],['vendors','#/vendors'],['activities','#/activities'],['notices','#/notices'],['contact','#/contact']];
const NAV=NAV_ALL.filter(([k])=>SHOW_VENDORS||k!=='vendors');

function chrome(cur){
 const hm=U?(U.role=='member'?'dash':cn[U.role][0]):null;
 document.documentElement.lang=LG;
 $('#brand').textContent=$('#brand2').textContent=T('brand');
 const lb=U?[t('dash'),'#/p/'+hm]:[T('login'),'#/p/login'];$('#loginBtn').textContent=$('#loginBtn2').textContent=lb[0];$('#loginBtn').href=$('#loginBtn2').href=lb[1];
 const jb=$('#joinBtn2');if(U){jb.textContent=t('logout');jb.href='#/';jb.onclick=()=>{__logout();return false}}else{jb.textContent=T('join');jb.href='#/p/register';jb.onclick=null}
 $('#lang').value=$('#lang2').value=LG;
 const a=NAV.map(([k,h])=>`<a href="${h}"${NAVKEY[cur]===k?' class="on" aria-current="page"':''}>${esc(N(k))}</a>`).join('');
 $('#nav').innerHTML=a;
 $('#menu').innerHTML=NAV.map(([k,h])=>`<a class="n" href="${h}">${esc(N(k))}</a>`).join('')+(U?`<a class="btn" href="#/p/${hm}">${esc(t('dash'))}</a><a class="btn s" href="#/" onclick="__logout();return false">${esc(t('logout'))}</a>`:`<a class="btn" href="#/p/register">${esc(T('join'))}</a><a class="btn s" href="#/p/login">${esc(T('login'))}</a>`);
 $('#foot').innerHTML=`<div><a class="logo" style="color:#fff" href="#/"><span class="mark" style="background:#fff;color:var(--p)">♻</span>${esc(T('brand'))}</a><p style="margin-top:12px">Kerala Scrap Merchants Association (KSMA)</p></div>
 <div><h2>${esc(SD.en.foot)}</h2><ul>${NAV.map(([k,h])=>`<li><a href="${h}">${esc(N(k))}</a></li>`).join('')}<li><a href="#/p/register">${esc(T('join'))}</a></li><li><a href="#/p/login">${esc(T('login'))}</a></li></ul></div>
 <div><h2>${esc(T('ctT'))}</h2>${T('addr').map(x=>`<p>${esc(x)}</p>`).join('')}<p><a href="tel:+919656884000">+91 9656 884 000</a></p><p><a href="mailto:info@aakrikada.in">info@aakrikada.in</a></p></div>`;
}
const NAVKEY={home:'home',about:'about',ksma:'ksma',committee:'committee',vendors:'vendors',activities:'activities',notices:'notices',contact:'contact',join:null,login:null};

function bind(r){
 const sf=$('#sf');if(sf){sf.onsubmit=e=>{e.preventDefault();S.q=$('#sq').value.trim();S.d=$('#sd').value;S.a=$('#sa')?$('#sa').value:'';S.bt=$('#sb2')?$('#sb2').value:'';S.vmsg=true;if(r==='vendors')render();else location.hash='#/vendors'};const sd=$('#sd');if(sd&&$('#sa'))sd.onchange=()=>{S.q=$('#sq').value.trim();S.d=sd.value;S.a='';S.bt=$('#sb2').value;render()}}
 document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{S.cat=b.dataset.cat;render()});
 document.querySelectorAll('[data-lt]').forEach(b=>b.onclick=()=>{S.committee=b.dataset.lt==='1';render()});
 const cf=$('#cf');if(cf)cf.onsubmit=e=>{e.preventDefault();$('#cm').hidden=false};
 const lf=$('#lf');if(lf)lf.onsubmit=e=>{e.preventDefault();$('#lm').hidden=false};
 const fp=$('#fp');if(fp)fp.onclick=e=>{e.preventDefault();$('#lm').hidden=false};
}
window.__logout=()=>{U=null;if(location.hash===''||location.hash==='#/')render();else location.hash='#/'};
function renderPortal(r){
 $('#app').hidden=true;$('#portal').hidden=false;
 R=r;draw();
 if(location.hash.startsWith('#/p/')){chrome('portal')}
 $('#menu').classList.remove('open');$('#bg').textContent='\u2630';$('#bg').setAttribute('aria-expanded','false');
 document.title='Member portal \u2013 Aakrikada (demo)';
}
function render(){
 const key=location.hash.replace(/^#\/?/,'');
 if(key==='p'||key.indexOf('p/')===0){return renderPortal(key.slice(2)||'login')}
 if(key==='vendors'&&!SHOW_VENDORS){location.replace('#/');return}
 if(key==='join'){location.replace('#/p/register');return}
 if(key==='login'){location.replace('#/p/login');return}
 $('#portal').hidden=true;$('#app').hidden=false;
 const r=ROUTES[key]??'home';
 if(r!=='vendors'&&r!=='home')S.vmsg=false;
 $('#app').innerHTML=P[r]();
 chrome(r);bind(r);
 $('#menu').classList.remove('open');$('#bg').textContent='\u2630';$('#bg').setAttribute('aria-expanded','false');
 document.title=(r==='home'?'':(N(NAVKEY[r])||'')+' \u2013 ')+'Aakrikada \u2013 KSMA (demo)';
}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);const f=$('#portal').hidden?$('#app'):$('#papp');f&&f.focus({preventScroll:true})});
['#lang','#lang2'].forEach(i=>$(i).onchange=e=>{LG=e.target.value;L={en:0,ml:1,ta:2}[LG];render()});
$('#bg').onclick=()=>{const o=$('#menu').classList.toggle('open');$('#bg').setAttribute('aria-expanded',o);$('#bg').textContent=o?'✕':'☰'};
$('#yr').textContent=new Date().getFullYear();
render();

})();
</script>
<style>.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}</style>
<script>
/* PWA: service worker + install button. Needs https (the Cloudflare link is https) or localhost. */
(function(){
 if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(e=>console.warn('SW failed',e)))}
 const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
 let dp=null;const b=document.getElementById('inst');
 addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;if(!standalone)b.hidden=false});
 b.onclick=async()=>{if(!dp)return;dp.prompt();await dp.userChoice;dp=null;b.hidden=true};
 addEventListener('appinstalled',()=>{b.hidden=true});
 if(/iphone|ipad|ipod/i.test(navigator.userAgent)&&!standalone)document.getElementById('iosTip').hidden=false;
})();
</script>
</body>
</html>
